browser:
  port: 9222
  verify: true

# 用户配置（务必与 iSmart 客户端中已登录的账号一致）
# 注意：这里的值会被当作字符串字面量，不要再套尖括号 <>
# 推荐不要把真实账号写在这个文件里（它会被 git 跟踪），两种更安全的做法：
#   1) 复制本段到同目录的 configs.local.yml（已在 .gitignore 中，不会进版本库）
#   2) 用环境变量：$env:ISMART_USER='手机号'; $env:ISMART_PASSWORD='密码'
user:
  username: <用户名>
  password: <密码>

# 答题配置
paper:
  skip-finished: true # 跳过已完成任务

  # 不同题目类型的随机得分（索引 = 题型 - 1）
  random-score:
    - 1 # 1.单选
    - 1 # 2.多选
    - 1 # 3.判断
    - [0.9, 1] # 4.填空
    - # 5.排序（留空表示不支持）
    - [0.9, 1] # 6.连线
    - # 7.完型填空
    - 1 # 8.匹配
    - [0.7, 1] # 9.口语跟读
    - [0.7, 1] # 10.短文改错
    - 1 # 11.选词填空
    - # 12.其他
  defaults: auto # 未知题型的处理方式（auto=按 default-score 估计；pause=手动输入）
  default-score: [0.8, 1]

# 学习时长模型：让上报的 seconds 与真实墙钟时间、内容体量都对得上
time:
  mode: real # real=按估算时长真实等待；fast=不等待（仅调试，有风控风险）
  base-seconds: 20 # 每个任务点打开/加载的基础耗时
  per-page: [6, 15] # 每"页"内容的阅读时间（秒）
  per-question: [25, 70] # 每道题的作答时间（秒）
  jitter-sigma: 0.35 # 对数正态抖动，越大长尾越明显
  clamp: [0.65, 1.7] # 采样结果相对估算值的允许区间
  break-chance: 0.05 # 任务点之间插入长间隔的概率（喝水/走神）
  break-seconds: [120, 600]
  max-task-minutes: 30 # 单任务点时长上限
